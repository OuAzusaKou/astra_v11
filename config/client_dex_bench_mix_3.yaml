# Unified mix client; select this profile via --task.
policy:
  host: 127.0.0.1
  port: 29555
  protocol: liber_teleop_v22
  action_row_offset: 0
runtime:
  fps: 30.0
  chunk_size: 32
  discard_steps: 0
  inference_mode: sync-no-sleep
  post_chunk_sleep: 1.5
  camera_latency: 0.100
  wrist_camera_latency: 0.04
  history_offsets:
  - 0
  crop_percent:
  - 100
  - 100
  - 100
  display: false
  record_head: null
startup:
  state_path: ops/dex_bench_tasks_mano/dex_bench_task_3_raw_all1000_frame0_mean_initial_state.json
  reset_state_path: ops/dex_bench_tasks_mano/dex_bench_task_3_raw_all1000_frame0_mean_initial_state.json
  wait_for_enter: true
action:
  arm_type: relative
  hand_type: relative
  hand_source: mano
tunnel:
  ssh_target: bce_dev01
  local_host: 127.0.0.1
  local_port: 29555
  remote_host: 127.0.0.1
  remote_port: 29566
instruction: Pick up the straw inserted in the soda can and insert it into the hole
  in the milk tea cup lid.
