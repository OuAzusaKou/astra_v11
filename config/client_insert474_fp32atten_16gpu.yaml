# Robot-side profile for tanfuyuan insert474 16-GPU ImageWAM with attention.
# GPU policy server: real_inference.sh --port 29584
#   experiments/train/insert474-full-mano198-hand05-lr5e5-fp32atten-b32-g512-16gpu
#   checkpoints/weights/step_010000.pt

policy:
  host: 127.0.0.1
  port: 29559
  expected_num_inference_steps: 10
  dataset_name: dex_bench_2

runtime:
  fps: 30.0
  chunk_size: 32
  discard_steps: 0
  history_offsets: [0, 10, 30]
  crop_percent: [100, 100, 100]
  display: false
  record_head: records/insert474_fp32atten_16gpu.mp4

startup:
  state_path: null
  reset_state_path: null
  wait_for_enter: true

action:
  arm_type: relative
  hand_type: relative
  hand_source: mano

tunnel:
  ssh_target: bce_dev01
  local_host: 127.0.0.1
  local_port: 29559
  remote_host: 127.0.0.1
  remote_port: 29584
