# Robot-side profile for teleop_q20 checkpoints: relative EE and absolute q20 hands.

policy:
  host: 127.0.0.1
  port: 29551
  expected_num_inference_steps: 10
  expected_image_num_inference_steps: 10

runtime:
  fps: 30.0
  chunk_size: 30
  discard_steps: 0
  post_chunk_sleep: 1.5
  history_offsets: [0, 10, 30]
  crop_percent: [100, 100, 100]
  display: false
  record_head: records/live_infer_q20_abs.mp4

startup:
  state_path: null
  reset_state_path: null
  wait_for_enter: true

action:
  arm_type: relative
  hand_type: absolute
  hand_source: q20

tunnel:
  ssh_target: baiduyun32
  local_host: 127.0.0.1
  local_port: 29551
  remote_host: 127.0.0.1
  remote_port: 29565
