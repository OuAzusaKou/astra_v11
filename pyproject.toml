[project]
name = "liberai-deploy"
version = "0.1.0"
description = "Minimal Leo robot client for Liber_Teleop v2.2 policy inference"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "av>=17.0,<18",
    "msgpack>=1.1,<2",
    "numpy>=2.0,<3",
    "opencv-python>=4.13,<5",
    "pin>=3.3,<5",
    "pyyaml>=6.0,<7",
    "scipy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
astra = ["Pillow>=10,<13"]

[tool.hatch.build.targets.wheel]
packages = ["progress_vlm", "astra", "envs", "mano", "policy_server", "scripts", "utils"]
